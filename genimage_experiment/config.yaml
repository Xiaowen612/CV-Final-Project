# Paths are relative to the directory from which you run Python.
data_root: data/GenImage
manifest_dir: manifests
run_dir: runs
generators:
  sd14: Stable Diffusion V1.4
  biggan: BigGAN
  adm: ADM
  glide: GLIDE
seen: [sd14, biggan]
unseen: [adm, glide]
split_seed: 2026
# Per generator, per class. Train+dev are sampled from official train.
train_per_class: 2000
dev_per_class: 500
test_per_class: 1000
image_size: 224
resize_short: 256
clip_id: openai/clip-vit-large-patch14
clip_revision: main
residual_rank: 1
lambda_orth: 1.0
lambda_energy: 1.0
epochs: 10
batch_size: 2
accumulation_steps: 16
eval_batch_size: 4
workers: 0
lr: 0.0002
head_lr: 0.001
weight_decay: 0.0005
patience: 3
amp: true
gradient_checkpointing: true
device: auto
seeds: [42, 43, 44]
methods: [clip_linear, effort, effort_aug, resnet50, deit_small, swin_tiny, cnnspot]
conditions: [clean, jpeg90, jpeg70, jpeg50, blur0.5, blur1, blur2, scale0.75, scale0.5, scale0.25]
